window.addEventListener('popstate',function(){if(skipPop){skipPop=false;return;}if(isOpen)doClose();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.keyCode===27)close();});
function closeBtn(e){if(e){e.preventDefault();e.stopPropagation();}close();}
var XB='<button type="button" class="xb" data-close="1">✕ 關閉</button>';
function locate(){
 var t=++ticket;
 body.innerHTML='<p class="msg">正在找你的位置…</p>'+XB;
 if(!navigator.geolocation){denied('這支手機無法取得位置。');return;}
 navigator.geolocation.getCurrentPosition(function(p){if(t!==ticket||!isOpen)return;here=[p.coords.latitude,p.coords.longitude];fromPier=false;render();},function(){if(t!==ticket||!isOpen)return;denied('');},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function denied(extra){
 var c=CFG[cur];
 body.innerHTML='<p class="msg warn"><b>請允許位置權限</b><br>'+(extra||'到手機設定允許這個網頁使用位置，再按一次「離我最近」。')+'</p><button type="button" class="alt" id="pierbtn">🚢 從碼頭算</button><p class="msg">從「'+c.pierName+'」算距離。</p>'+XB;
 document.getElementById('pierbtn').onclick=function(){here=CFG[cur].pier;fromPier=true;render();};
}
function render(){
 var c=CFG[cur];var list=P.filter(function(p){return p.i===cur;}).map(function(p){return{p:p,d:dist(here[0],here[1],p.y,p.x)};}).sort(function(a,b){return a.d-b.d;});
 var far=list.length&&list[0].d>50000;
 var f=list.filter(function(o){return cat==="全部"||o.p.c.indexOf(cat)>=0;}).slice(0,10);
 var h='';
 if(fromPier)h+='<p class="msg">🚢 從<b>'+c.pierName+'</b>算的距離。</p>';
 else if(far)h+='<p class="msg warn">你現在不在這個島，距離僅供參考。</p>';
 h+=f.map(function(o){var p=o.p;var u='https://www.google.com/maps/dir/?api=1&destination='+p.y+','+p.x+'&travelmode='+c.mode;
  return '<a class="row" href="'+u+'" target="_blank" rel="noopener"><span class="ri">'+IC[p.c[0]]+'</span><span class="rm"><span class="rn">'+esc(p.n)+'</span><span class="rnote">'+esc(p.t)+'</span></span><span class="rd">'+fmt(o.d)+'<small>'+p.c.join('・')+'</small></span></a>';}).join('');
 if(!f.length)h+='<p class="msg">這個類別沒有點。</p>';
 if(!fromPier)h+='<button type="button" class="alt" id="pierbtn">🚢 改從碼頭算</button>';
 h+=XB;
 body.innerHTML=h;body.scrollTop=0;
 var b=document.getElementById('pierbtn');if(b)b.onclick=function(){here=c.pier;fromPier=true;render();};
}
chips.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;cat=b.getAttribute('data-k');[].forEach.call(chips.children,function(x){x.classList.toggle('on',x===b);});if(here)render();});
document.getElementById('sx').addEventListener('click',closeBtn);
body.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-close]');if(b)closeBtn(e);});
sheet.addEventListener('click',function(e){if(e.target===sheet)closeBtn(e);});
[].forEach.call(document.querySelectorAll('.near'),function(b){b.onclick=function(){open(b.getAttribute('data-i'));};});
})();
</script><!--/sheet--></body></html>
