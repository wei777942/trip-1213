<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>宮古・沖繩・石垣</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.6;color:#2b2622;background:#f7f1e8;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:32px 18px 44px}
h1{font-size:30px;font-weight:800;letter-spacing:.08em;text-align:center;margin:0 0 26px;color:#3a2f27}
h1::after{content:"";display:block;width:44px;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,#26b5a8,#f08a6c,#2f6fb3)}
.day{--c:#13857b;--c2:#3cbfb0;--tint:#e8f7f5;background:#fff;border-radius:26px;overflow:hidden;margin:0 0 26px;box-shadow:0 10px 30px rgba(80,55,30,.10),0 2px 6px rgba(80,55,30,.06)}
.okinawa{--c:#cf5536;--c2:#f0906f;--tint:#fdeee8}
.ishigaki{--c:#245f9e;--c2:#4f9bd6;--tint:#e8f0fa}
.hero{position:relative;padding:26px 24px 52px;color:#fff;background:linear-gradient(135deg,var(--c2) 0%,var(--c) 100%)}
.sun{position:absolute;top:-14px;right:-14px;width:120px;height:120px}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:40px;display:block}
.d{position:relative;margin:0;font-size:21px;font-weight:700;opacity:.95;letter-spacing:.03em}
h2{position:relative;margin:0;font-size:40px;line-height:1.25;font-weight:800;letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.12)}
.tr{position:relative;display:inline-block;margin:12px 0 0;padding:4px 16px;font-size:20px;font-weight:700;background:rgba(255,255,255,.24);border-radius:999px}
.body{padding:6px 18px 20px}
.tip{margin:0 4px 14px;font-size:19px;color:#5a4f47;line-height:1.55}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:108px;padding:12px 6px;background:#fff;border:2px solid var(--tint);border-radius:20px;text-decoration:none;color:#2b2622;box-shadow:0 3px 10px rgba(80,55,30,.07);transition:transform .12s,box-shadow .12s,background .12s;-webkit-tap-highlight-color:transparent}
.btn:last-child:nth-child(odd){grid-column:1 / -1}
.btn .em{font-size:38px;line-height:1.2}
.btn .lb{font-size:22px;font-weight:800;color:var(--c);letter-spacing:.08em}
.btn:active{transform:scale(.96);background:var(--tint);box-shadow:0 1px 4px rgba(80,55,30,.08)}
.btn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.foot{margin:6px 8px 0;padding:16px 18px;font-size:19px;line-height:1.6;color:#5a4f47;text-align:center;background:#efe6d8;border-radius:18px}
</style></head><body><main>

" href="https://maps.app.goo.gl/QA9VxDi8ouCQFbLi8" target="_blank" rel="noopener"><span class="em">🛍️</span><span class="lb">購物</span></a><a class="btn" href="https://maps.app.goo.gl/5UhrELmi8MwK8W7i8" target="_blank" rel="noopener"><span class="em">🍢</span><span class="lb">小吃</span></a><a class="btn" href="https://maps.app.goo.gl/vEVTZLHC6UDDRspW6" target="_blank" rel="noopener"><span class="em">🍽️</span><span class="lb">餐廳</span></a><a class="btn" href="https://maps.app.goo.gl/HRwYXu3bRa1XNvwLA" target="_blank" rel="noopener"><span class="em">⛩️</span><span class="lb">景點</span></a><a class="btn" href="https://maps.app.goo.gl/apJbSzx68qaowwsr8" target="_blank" rel="noopener"><span class="em">🎁</span><span class="lb">伴手禮</span></a></div></div></section>
